<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="gl">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- /\_/\ 尖耳朵 -->
  <!-- 左耳 -->
  <path d="M 30 58 L 22 18 L 44 50" fill="#f0b429" stroke="none"/>
  <!-- 左耳内 -->
  <path d="M 32 54 L 26 26 L 42 50" fill="#e08a10" stroke="none"/>
  <!-- 右耳 -->
  <path d="M 90 58 L 98 18 L 76 50" fill="#f0b429" stroke="none"/>
  <!-- 右耳内 -->
  <path d="M 88 54 L 94 26 L 78 50" fill="#e08a10" stroke="none"/>

  <!-- 头部圆形 -->
  <ellipse cx="60" cy="68" rx="36" ry="32" fill="#f0b429"/>

  <!-- 脸部内圈（稍深一点层次感） -->
  <ellipse cx="60" cy="70" rx="28" ry="24" fill="#e5a520" opacity="0.4"/>

  <!-- ◉ 左眼 — 大圆眼 -->
  <circle cx="44" cy="64" r="11" fill="#1a1a2e"/>
  <circle cx="44" cy="64" r="8" fill="#0a0a18"/>
  <circle cx="44" cy="64" r="4.5" fill="#f0b429"/>
  <circle cx="44" cy="64" r="2" fill="#1a1a2e"/>
  <!-- 眼睛高光 -->
  <circle cx="40.5" cy="60.5" r="2.5" fill="white" opacity="0.85"/>
  <circle cx="47" cy="67" r="1.2" fill="white" opacity="0.4"/>

  <!-- ◉ 右眼 — 大圆眼 -->
  <circle cx="76" cy="64" r="11" fill="#1a1a2e"/>
  <circle cx="76" cy="64" r="8" fill="#0a0a18"/>
  <circle cx="76" cy="64" r="4.5" fill="#f0b429"/>
  <circle cx="76" cy="64" r="2" fill="#1a1a2e"/>
  <!-- 眼睛高光 -->
  <circle cx="72.5" cy="60.5" r="2.5" fill="white" opacity="0.85"/>
  <circle cx="79" cy="67" r="1.2" fill="white" opacity="0.4"/>

  <!-- ω 鼻子+嘴 -->
  <ellipse cx="55.5" cy="78" rx="4" ry="3" fill="none" stroke="#1a1a2e" stroke-width="1.8"/>
  <ellipse cx="64.5" cy="78" rx="4" ry="3" fill="none" stroke="#1a1a2e" stroke-width="1.8"/>
  <!-- 鼻尖小三角 -->
  <path d="M 58 74 L 60 72 L 62 74 Z" fill="#d4820e"/>

  <!-- 胡须 -->
  <g stroke="#1a1a2e" stroke-width="1.2" stroke-linecap="round" opacity="0.3">
    <line x1="32" y1="72" x2="16" y2="68"/>
    <line x1="32" y1="78" x2="14" y2="80"/>
    <line x1="88" y1="72" x2="104" y2="68"/>
    <line x1="88" y1="78" x2="106" y2="80"/>
  </g>

  <!-- 微妙的量子光晕（眼睛发光感） -->
  <circle cx="44" cy="64" r="12" fill="none" stroke="#f0b429" stroke-width="0.5" opacity="0.25" filter="url(#gl)"/>
  <circle cx="76" cy="64" r="12" fill="none" stroke="#f0b429" stroke-width="0.5" opacity="0.25" filter="url(#gl)"/>
</svg>
