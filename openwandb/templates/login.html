<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWandb - Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 0 24px;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px 32px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo svg { width: 48px; height: 48px; color: var(--accent); }
        .auth-logo h2 { font-size: 22px; margin-top: 12px; }
        .auth-logo p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .auth-tab:hover { color: var(--text-primary); }
        .auth-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: var(--accent); }
        .form-group input::placeholder { color: var(--text-muted); }
        .btn-auth {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #1a1a2e;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        .btn-auth:hover { background: var(--accent-hover); }
        .btn-auth:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-error {
            background: rgba(234, 84, 85, 0.15);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            OpenWandb
        </a>
    </nav>

    <div class="auth-container fade-in">
        <div class="auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <h2>Welcome to OpenWandb</h2>
                <p>Open-source ML experiment tracking</p>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('login')">Login</div>
                {% if allow_registration %}
                <div class="auth-tab" onclick="switchTab('register')">Register</div>
                {% endif %}
            </div>

            <div id="authError" class="auth-error"></div>

            <!-- 登录表单 -->
            <form id="loginForm" class="auth-form active" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-auth" id="loginBtn">Login</button>
            </form>

            <!-- 注册表单 -->
            {% if allow_registration %}
            <form id="registerForm" class="auth-form" onsubmit="doRegister(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required autocomplete="username" minlength="2">
                </div>
                <div class="form-group">
                    <label>Display Name (optional)</label>
                    <input type="text" id="regDisplayName" placeholder="Your display name" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email (optional)</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn-auth" id="regBtn">Create Account</button>
            </form>
            {% endif %}
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.querySelector('.auth-tab:first-child').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelector('.auth-tab:last-child').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            document.getElementById('authError').style.display = 'none';
        }

        function showError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';
            document.getElementById('authError').style.display = 'none';

            try {
                const resp = await fetch('/api/v2/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('loginUsername').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await resp.json();
                if (resp.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.detail || 'Login failed');
                }
            } catch (err) {
                showError('Network error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function doRegister(e) {
            e.preventDefault();
            const pw = document.getElementById('regPassword').value;
            const pw2 = document.getElementById('regPasswordConfirm').value;
            if (pw !== pw2) {
                showError('Passwords do not match');
                return;
            }

            const btn = document.getElementById('regBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            document.getElementById('authError').style.display = 'none';

            try {
                const resp = await fetch('/api/v2/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('regUsername').value,
                        password: pw,
                        display_name: document.getElementById('regDisplayName').value,
                        email: document.getElementById('regEmail').value
                    })
                });
                const data = await resp.json();
                if (resp.ok && data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.detail || 'Registration failed');
                }
            } catch (err) {
                showError('Network error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }
    </script>
</body>
</html>
